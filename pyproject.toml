[project]
name = "f1-predictor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "WiebeM-2468137", email = "wiebe.mermans@student.uhasselt.be" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "requests-cache>=1.3.3",
    "scikit-learn>=1.9.1",
    "typer>=0.27.3",
    "xgboost>=3.4.1",
]

[project.scripts]
f1-predictor = "f1_predictor:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle-fouten
    "F",   # pyflakes (ongebruikte imports/variabelen)
    "I",   # import-sortering
    "UP",  # moderniseer syntax voor je Python-versie
    "B",   # veelvoorkomende bugs
]

[tool.pytest.ini_options]
testpaths = ["tests"]
