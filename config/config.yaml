# Projectconfiguratie, gelezen door de CLI (`uv run f1 ...`).
# Alle velden, defaults en toegestane waarden staan in docs/usage.md.

data:
  start_season: 2014 # eerste seizoen voor `f1 fetch`
  end_season: null # null = het huidige kalenderjaar

features:
  groups: # vaste volgorde; bepaalt welke featurekolommen gebouwd worden
    - starting_position
    - driver_form
    - team_form
    - championship
    - circuit_history
    - teammate
  form_windows: [3, 5] # vensters (in races) voor coureurs- en teamvorm
  rate_window: 10 # venster voor uitvalpercentage en teamgenoot-winstpercentage
  circuit_shrinkage: 3.0 # krimp van de circuitafwijking naar 0 bij weinig historie

model:
  # Eindmodel: wordt getraind door `f1 train` en gebruikt door `f1 predict`. Gekozen met de
  # regel uit docs/model.md: hoogste podiumoverlap op de validatieraces 2015-2021, bij
  # gelijkstand het hoogste aandeel juiste winnaars, daarna de laagste MAE.
  final: xgb_ranker
  # Per familie de configuratie met de laagste validatie-MAE uit `f1 tune`
  # (output/model_tuning.csv); `f1 backtest` vergelijkt deze modellen met de baselines.
  tuned:
    ridge:
      feature_set: upto_championship
      params: {alpha: 10.0}
    xgb_regressor:
      feature_set: all
      params: {max_depth: 2, n_estimators: 100}
    xgb_ranker:
      feature_set: all
      params: {max_depth: 2, n_estimators: 50}
    xgb_ranker_ndcg:
      feature_set: all
      params: {max_depth: 1, n_estimators: 300}

backtest:
  min_train_races: 20 # eerste races die alleen als trainingshistorie dienen
