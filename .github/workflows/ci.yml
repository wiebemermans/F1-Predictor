name: CI

# Wijzigingen die alleen documentatie raken, starten geen CI: de tests lezen geen Markdown.
# `output/` staat hier bewust niet bij, want een test leest `output/model_tuning.csv`.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests with coverage
        run: uv run pytest --cov

      # Alleen rapporteren: de ondergrens wordt al in de teststap bewaakt.
      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
